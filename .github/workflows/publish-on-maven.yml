name: Publish to Maven Central

# Tag-driven, not release-driven: publishing the libraries must not wait on
# (or be blocked by) the GraalVM gallery build that creates the GitHub release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-maven-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-natives:
    uses: ./.github/workflows/build-natives.yaml

  publish:
    name: Publish libraries
    needs: build-natives
    # macOS is required: the library modules declare Apple targets, whose klibs
    # can only be built (and therefore published) on a Mac.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'natives-*'
          merge-multiple: true

      - name: Verify all natives present
        run: |
          EXPECTED=(
            "macosui-icons/src/jvmMain/resources/nucleus/native/darwin-aarch64/libnucleus_sfsymbols.dylib"
            "macosui-icons/src/jvmMain/resources/nucleus/native/darwin-x64/libnucleus_sfsymbols.dylib"
          )
          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(wc -c < "$f") bytes)"
            else
              echo "MISSING: $f" >&2
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then exit 1; fi

      # 21, not 17: some dependencies ship JVM target 21 bytecode that gets
      # inlined, which a 17 toolchain refuses to compile.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve published version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to publish from ref '$REF_NAME': expected a vX.Y.Z[-suffix] tag." >&2
            exit 1
          fi
          echo "Publishing dev.nucleusframework:compose-macos-ui* version $VERSION"

      # Root-level task: publishes every module applying the publish plugin
      # (compose-macos-ui, -icons, -icons-extended, -markdown). Each module
      # derives its version from GITHUB_REF.
      - name: Publish
        # The vanniktech publish tasks are not configuration-cache compatible.
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache --stacktrace
        env:
          GITHUB_REF: ${{ github.ref }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNINGKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNINGPASSWORD }}
