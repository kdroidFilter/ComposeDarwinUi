kotlin-math = { module = "dev.romainguy:kotlin-math", version.ref = "kotlinMath" }
liquid = { module = "io.github.fletchmckee.liquid:liquid", version.ref = "liquid" }
highlights = { module = "dev.snipme:highlights", version.ref = "highlights" }
icons-lucide-cmp = { module = "com.composables:icons-lucide-cmp", version.ref = "iconsLucideCmp" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
